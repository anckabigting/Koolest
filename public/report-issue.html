<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report a Website Issue - Koolest AC Services</title>

  <link rel="icon" type="image/png" href="../public/assets/koolest_logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Righteous&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="../public/stylesheets/style.css" />

  <!-- Page Specific Stylesheet -->
  <link rel="stylesheet" href=" ../public/stylesheets/report-issue.css" />

  <!-- Page JS Script -->
  <script src=" ../public/js/report-issue.js" defer></script>
</head>
<body class="report-page-body">

  <!-- ================= NAVBAR ================= -->
  <header class="navbar glass-nav">
    <div class="brand-container">
      <div class="container nav-container"></div>
      <img src="../public/assets/koolest_logo.png" alt="Koolest Logo" class="brand-logo">
      <span class="brand-title">Koolest</span>
    </div>

    <nav class="nav-links">
      <a href="../index.html#services">Services</a>
      <a href="../index.html#testimonials">Reviews</a>
      <a href="../index.html#rate-us">Rate Us</a>
      <a href="../index.html#contact-us">Contact Us</a>
      <a href="../index.html#gallery">Gallery</a>
      <a href="../index.html#booking" class="btn-yellow">Book Now</a>
    </nav>
  </header>

  <!-- ================= REPORT BUG FORM SECTION ================= -->
  <main class="report-section">
    <div class="report-card">
      <a href="../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>

      <h2 class="report-title">Report a Website Issue</h2>
      <p class="report-subtitle">Spotted a bug, broken link, or display issue on our site? Let us know so we can fix it right away!</p>

      <!-- Dynamic Message Banner Container -->
      <div id="issueMessageBanner" class="form-feedback-banner" style="display: none;"></div>

      <form id="bugReportForm" class="styled-form">
        <!-- Name (Optional) -->
        <div class="form-group">
          <label for="reporterName">Your Name <span class="optional-text">(Optional)</span></label>
          <input type="text" id="reporterName" class="form-input" placeholder="e.g. Jane Doe" />
        </div>

        <!-- Email for Follow-up -->
        <div class="form-group">
          <label for="reporterEmail">Email Address</label>
          <input type="email" id="reporterEmail" class="form-input" placeholder="e.g. jane@example.com" required />
        </div>

        <!-- Issue Category -->
        <div class="form-group">
          <label for="issueType">Type of Issue</label>
          <select id="issueType" class="form-input form-select" required>
            <option value="" disabled selected>Select issue category...</option>
            <option value="broken link or button">Broken Link or Button</option>
            <option value="visual/layout glitch">Visual / Layout Glitch</option>
            <option value="form submission error">Form Submission Error</option>
            <option value="mobile/screen display problem">Mobile / Screen Display Problem</option>
            <option value="other website bug">Other Website Bug</option>
          </select>
        </div>

        <!-- Issue Description -->
        <div class="form-group">
          <label for="issueDetails">Describe the Bug</label>
          <textarea id="issueDetails" class="form-input form-textarea" rows="4" placeholder="Please describe what happened (e.g. 'The Book Now button didn't respond on mobile')..." required></textarea>
        </div>

        <button type="submit" class="btn-yellow btn-full">Submit Bug Report</button>
      </form>
    </div>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="site-footer">
    <div class="footer-content">
      <p>&copy; 2026 Koolest AC Services. All rights reserved.</p>
      <div class="footer-links">
        <a href="../index.html">Back to Home</a>
      </div>
    </div>
  </footer>

</body>
</html>
